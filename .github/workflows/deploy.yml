name: Build & Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_FRONTEND: compass/frontend
  ECR_BACKEND: compass/backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND:${{ github.sha }} \
                        -t $REGISTRY/$ECR_BACKEND:latest \
                        ./backend
          docker push $REGISTRY/$ECR_BACKEND --all-tags

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/v1' }}
        run: |
          docker build -t $REGISTRY/$ECR_FRONTEND:${{ github.sha }} \
                        -t $REGISTRY/$ECR_FRONTEND:latest \
                        --build-arg VITE_API_URL=$VITE_API_URL \
                        --build-arg VITE_FEATURE_ALARM=false \
                        ./frontend
          docker push $REGISTRY/$ECR_FRONTEND --all-tags

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/compass/deploy.sh"]' \
            --comment "Deploy Compass ${{ github.sha }}" \
            --output text
          echo "Deployment triggered via SSM"

      - name: Wait for deployment
        run: |
          echo "Waiting 30s for containers to start..."
          sleep 30

      - name: Health check
        run: |
          STATUS=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["curl -sf http://localhost:8000/health || echo UNHEALTHY"]' \
            --output text)
          echo "Health check triggered: $STATUS"
